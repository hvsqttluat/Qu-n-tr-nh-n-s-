name: desktop-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\QuanLyNhanSuWpf\QuanLyNhanSuWpf.sln

      - name: Build
        run: dotnet build .\QuanLyNhanSuWpf\QuanLyNhanSuWpf.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\QuanLyNhanSuWpf\QuanLyNhanSuWpf.sln -c Release --no-build

      - name: Publish
        run: dotnet publish .\QuanLyNhanSuWpf\QuanLyNhanSuWpf.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\QuanLyNhanSuWpf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyNhanSuWpf-win-x64
          path: .\artifacts\QuanLyNhanSuWpf
